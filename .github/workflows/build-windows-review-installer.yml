name: Build Windows reviewer installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewer version without a leading v
        required: true
        default: "1.0.1"

permissions:
  contents: read

jobs:
  build-windows-review-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0" pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Run source smoke test
        shell: pwsh
        run: |
          python -m code.scripts.smoke_test

      - name: Build Windows reviewer application
        shell: pwsh
        run: |
          python packaging/review/windows/build_app.py

      - name: Smoke-test packaged reviewer server
        shell: pwsh
        run: |
          $env:PAMALYTICS_HOME = "$env:RUNNER_TEMP\PAMalyticsReviewTestHome"

          $process = Start-Process `
            -FilePath ".\dist-review-windows\PAMalytics Review\PAMalytics Review.exe" `
            -ArgumentList "--pamalytics-streamlit-server" `
            -PassThru `
            -WindowStyle Hidden

          try {
            $ready = $false

            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1

              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8511/_stcore/health" `
                  -UseBasicParsing `
                  -TimeoutSec 2

                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
              catch {
              }

              if ($process.HasExited) {
                throw "Packaged PAMalytics reviewer server exited with code $($process.ExitCode)."
              }
            }

            if (-not $ready) {
              throw "Packaged PAMalytics reviewer server did not become ready within 120 seconds."
            }

            $demoProject = Join-Path `
              $env:PAMALYTICS_HOME `
              "projects\PAMalytics_review_demo\project.json"

            if (-not (Test-Path $demoProject)) {
              throw "Bundled reviewer demo was not installed at $demoProject"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Build reviewer installer
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path release-review-windows |
            Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            "/DMySourceDir=$env:GITHUB_WORKSPACE\dist-review-windows\PAMalytics Review" `
            "/DMyOutputDir=$env:GITHUB_WORKSPACE\release-review-windows" `
            "packaging\review\windows\PAMalytics-review.iss"

      - name: Create checksum
        shell: pwsh
        run: |
          $filename = "PAMalytics-review-v${{ inputs.version }}-windows-x64-setup.exe"
          $setup = Join-Path "release-review-windows" $filename

          if (-not (Test-Path $setup)) {
            throw "Reviewer installer was not created: $setup"
          }

          Get-FileHash -Algorithm SHA256 $setup |
            ForEach-Object {
              "$($_.Hash.ToLower())  $filename"
            } |
            Set-Content "$setup.sha256"

      - name: Upload reviewer installer
        uses: actions/upload-artifact@v4
        with:
          name: PAMalytics-review-v${{ inputs.version }}-windows-x64-installer
          path: |
            release-review-windows/PAMalytics-review-v${{ inputs.version }}-windows-x64-setup.exe
            release-review-windows/PAMalytics-review-v${{ inputs.version }}-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
